name: IPTV组播源自动处理

# 触发条件：支持手动触发，同时默认每天UTC时间16点（北京时间凌晨）自动运行
on:
  workflow_dispatch: # 手动触发按钮
  schedule:
    - cron: '0 16 * * *' # 定时规则，可按需修改，参考 cron 语法

jobs:
  process-and-update:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码（用于后续推送生成的JXZB.txt）
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # GitHub自动提供的推送权限令牌

      # 2. 配置Python环境
      - name: 设置Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. 安装依赖
      - name: 安装requests库
        run: pip install requests

      # 4. 执行IPTV源处理逻辑
      - name: 处理组播源
        run: |
          import os
          import sys
          import requests

          # 固定下载源（已把blob链接改为raw链接，直接获取文件内容）
          SOURCE_URL = "https://gh-proxy.com/https://github.com/Wind5170/IPTV/raw/c9871285ca010815afdc807879d66752cfc0b59d/output/zubo.txt"

          def read_content(source):
              """读取远程链接内容"""
              try:
                  print(f"正在下载远程文件：{source}")
                  response = requests.get(source, timeout=15)
                  response.raise_for_status()
                  content = response.content.decode(response.apparent_encoding)
                  print("远程文件下载成功")
                  return content
              except requests.exceptions.RequestException as e:
                  print(f"❌ 远程文件下载失败：{str(e)}")
                  sys.exit(1)

          def process_iptv_content(content):
              """处理IPTV源内容，核心逻辑"""
              lines = content.splitlines()
              result = []
              current_group = None
              seen_provinces = set()

              for line in lines:
                  line = line.strip()
                  if not line:
                      continue

                  # 处理分组行
                  if "#genre#" in line:
                      original_group = line.split(",#genre#")[0].strip()
                      province = original_group[:2] if len(original_group) >=2 else original_group
                      
                      # 同省份分组去重
                      if province not in seen_provinces:
                          new_genre = f"{province}组播,#genre#"
                          result.append(new_genre)
                          seen_provinces.add(province)
                      
                      current_group = original_group
                      continue

                  # 处理频道行
                  if not current_group:
                      print(f"⚠️ 警告：发现无分组的频道行，已跳过：{line}")
                      continue
                  if "," not in line:
                      print(f"⚠️ 警告：格式错误的频道行，已跳过：{line}")
                      continue
                  
                  channel_name, url = line.split(",", 1)
                  # 注意$在GitHub Actions中需要转义为$$
                  new_line = f"{channel_name},{url}$${current_group}"
                  result.append(new_line)
              
              return result

          # 执行处理流程
          content = read_content(SOURCE_URL)
          processed_lines = process_iptv_content(content)

          # 输出到JXZB.txt
          output_path = "JXZB.txt"
          try:
              with open(output_path, 'w', encoding='utf-8') as f:
                  f.write("\n".join(processed_lines))
              print(f"\n✅ 处理完成！共生成 {len(processed_lines)} 行内容")
          except Exception as e:
              print(f"❌ 文件写入失败：{str(e)}")
              sys.exit(1)

      # 5. 提交并推送到main分支
      - name: 提交更新到main分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add JXZB.txt
          # 如果文件有变化才提交，避免空提交
          if git diff --cached --quiet; then
            echo "文件无变化，跳过提交"
          else
            git commit -m "自动更新组播源JXZB.txt $(date +%Y-%m-%d\ %H:%M)"
            git push origin HEAD:main
          fi
