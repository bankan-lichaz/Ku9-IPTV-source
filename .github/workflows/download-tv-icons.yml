name: Download TV Icons

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      trigger_source:
        description: '触发来源'
        required: false
        default: '手动触发'
  
  # 定时执行：每天凌晨 2:04 运行（UTC时间，对应北京时间 10:04）
  schedule:
    - cron: '4 2 * * *'
  
  # 当代码推送到 main 分支时也触发
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/download_icons.py'

jobs:
  download-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # cache: 'pip' 
        #当 cache: 'pip'（或 cache: 'conda'）被打开时，
        #setup-python 会自动去寻找 锁定文件（requirements.txt, pyproject.toml, Pipfile.lock, poetry.lock 等）来计算缓存的 hash。
        # 如果找不到，就会抛出上面的错误。
        
    - name: Install dependencies
      run: |
        pip install requests
        echo "Python 版本: $(python --version)"
        echo "Requests 版本: $(python -c 'import requests; print(requests.__version__)')"
        
    - name: Create output directory
      run: |
        mkdir -p tv_icons
        echo "TV_ICONS_DIR=$(pwd)/tv_icons" >> $GITHUB_ENV
        
    - name: Run download script
      run: |
        cd scripts
        python download_icons.py
        cd ..
        
    - name: List downloaded files
      run: |
        echo "📊 文件统计:"
        ls -lah tv_icons/ | wc -l
        echo ""
        echo "📁 文件详情:"
        ls -lah tv_icons/
        
    - name: Upload icons as artifact
      uses: actions/upload-artifact@v4
      with:
        name: tv-icons-${{ github.run_number }}
        path: tv_icons/
        retention-days: 30
        compression-level: 6
        if-no-files-found: warn
        
    - name: Upload to GitHub Release (Optional)
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: icons-${{ github.run_number }}
        name: TV Icons Build ${{ github.run_number }}
        files: tv_icons/*.webp
        body: |
          ## 电视图标包
          - 生成时间: ${{ github.event.head_commit.timestamp }}
          - 包含文件: ${{ steps.count.outputs.files }} 个
          - 触发原因: ${{ github.event.inputs.trigger_source || '自动构建' }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
