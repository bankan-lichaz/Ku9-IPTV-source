name: Update ZZ (LNWSDY)

on:
  schedule:
    - cron: "0 */6 * * *"     # 每6小时执行
  workflow_dispatch:         # 手动执行

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch 辽宁联通组播列表
        run: |
          curl -s -o ln.txt "https://raw.githubusercontent.com/Wind5170/IPTV/refs/heads/main/output/all/辽宁联通.txt"

      - name: Extract ALL 辽宁卫视 IP:PORT
        run: |
          # 找出所有辽宁卫视行
          lines=$(grep "^辽宁卫视," ln.txt)

          ipports=""

          # 遍历每一行
          while IFS= read -r line; do
            url=$(echo "$line" | cut -d',' -f2)
            url_no_http=${url#http://}
            ipport=$(echo "$url_no_http" | cut -d'/' -f1)

            # 累加结果
            if [ -z "$ipports" ]; then
              ipports="$ipport"
            else
              ipports="$ipports,$ipport"
            fi
          done <<< "$lines"

          echo "IPPORTS=$ipports" >> $GITHUB_ENV

      - name: Run scanner
        run: |
          # 调用扫描脚本，传入原始IPPORTS，获取过滤后的有效列表
          valid_ipports=$(python3 ps2.py "$IPPORTS")
          # 更新环境变量，后续步骤自动使用过滤后的有效列表
          echo "IPPORTS=${valid_ipports}" >> $GITHUB_ENV
          # 打印扫描结果摘要
          valid_count=$(echo "$valid_ipports" | tr ',' '\n' | grep -c .)
          echo "✅ 扫描完成，共保留 ${valid_count} 个有效IP:PORT"
        env:
          # 可自定义参数，按需调整
          SCAN_TIMEOUT: 2    # 端口扫描超时时间（秒），网络差可调大到3-5
          MAX_WORKERS: 20    # 最大并发线程数，IP数量多可适当调大（建议≤50）

      #- name: Update only FIRST line of ZZ
      #  run: |
      #    old_content=$(cat ZZ)
      #    tail_content=$(echo "$old_content" | tail -n +2)

      #    echo "4,${IPPORTS}" > ZZ
      #    echo "$tail_content" >> ZZ

      # 更新第N行内容
      # 保留前N-1行：first_line=$(echo "$old_content" | head -n $((N-1)))
      # 追加第N+1行及以后：tail_content=$(echo "$old_content" | tail -n +$((N+1)))
      
      - name: Update only SECOND line of ZZ # 步骤名也可以对应改下
        run: |
          old_content=$(cat ZZ)
          # 新增：提取原文件的第一行，保留下来
          first_line=$(echo "$old_content" | head -n 1)
          tail_content=$(echo "$old_content" | tail -n +3)
      
          # 先写原第一行到文件（会清空原文件）
          echo "$first_line" > ZZ
          # 再写新内容，此时就会出现在第二行
          echo "4,${IPPORTS}" >> ZZ
          # 最后追加原文件第3行及以后的内容
          echo "$tail_content" >> ZZ

      # - name: Update only SECOND line of ZZ # 直接覆盖第二行的原有内容 简洁 不容易出错
      #  run: |
          # 2s/.*/替换内容/ 表示把第2行的所有内容替换成新值
      #    sed -i '2s/.*/4,'"${IPPORTS}"'/' ZZ
          # 2i 表示在第二行前面插入内容，-i 表示直接修改原文件
      #    sed -i "2i\\4,${IPPORTS}" ZZ1

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add ZZ
          git commit -m "Update ZZ Second line with tyj sources (${IPPORTS})" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
