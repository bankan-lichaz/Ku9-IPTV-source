name: Update ZBs

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时运行一次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ipaddress
          pip install requests

      - name: Run scanner
        run: |
          python ps.py

      - name: Encrypt ZBs
        run: |
          echo "开始加密 ZBs..."
          node encrypt.js file=ZZ
          node encrypt.js file=ZB1
          node encrypt.js file=ZB2
          node encrypt.js file=ZB3
          node encrypt.js file=ZB4
          node encrypt.js file=ZB5
          node encrypt.js file=ZB6
          node encrypt.js file=ZB7
          node encrypt.js file=ZB8
          node encrypt.js file=ZB9
          node encrypt.js file=ZB

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add ZZ ZB2 ZB
          git commit -m "Update ZBs from scanner" || echo "No changes"
          git push
