name: 每日更新IPTV-LCP组播源

on:
  # 每天 UTC 0:00 运行（对应北京时间早上 8:00）
  schedule:
    - cron: '0 16 * * *'
  # 允许手动在 Actions 页面触发
  workflow_dispatch:

# 让工作流拥有往仓库推送内容的权限
permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 检出仓库代码
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true   # 后续 push 需要保持凭据

      # 2️⃣ 安装 Python 并获取依赖（requests）
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'   # 使用最新的 3.x 版本

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 3️⃣ 运行处理脚本
      - name: 运行 IPTV 处理脚本
        run: |
          python scripts/process_iptv_lcp.py

      # 4️⃣ 提交并推送更新后的 LCP.txt（若无变化则跳过）

      - name: 筛选CCTV卫生健康频道并输出到新文件
        run: |
          # 规则说明和之前完全一致：
          # 1. ^ 匹配行首，避免误匹配中间包含关键词的其他频道
          # 2. 如果频道名后紧跟逗号（比如你的示例结构），可改成 '/^CCTV卫生健康,/!d' 匹配更精准
          # 3. 如果行首可能有空格缩进，改成 '/^\s*CCTV-卫生健康/!d' 即可兼容
          # ✅ 核心改动：去掉-i参数，加>重定向到目标文件，不会修改原LCP.txt
          #  sed -i '/^CCTV-卫生健康/!d' LCP.txt
          sed '/^CCTV卫生健康,/!d' LCP.txt > LCPINI

          # 👉 如果你的文件里频道名是「CCTV卫生健康」（无短横线，和你的示例第一行写法一致），把上面命令改成：
          # sed '/^CCTV卫生健康/!d' LCP.txt > LCPINI

      - name: Encrypt LCP.txt
        run: |
          echo "开始加密 LCP.txt..."
          node encrypt.js file=LCP.txt
          node encrypt.js file=LCPINI
      
      # - name: 提交更改
      #  run: |
      #    git config user.name "github-actions[bot]"
      #    git config user.email "github-actions[bot]@users.noreply.github.com"
   
          # 检查是否有实际变动，避免空提交
       #   if git diff --quiet JXZB.txt; then
       #     echo "📂 JXZB.txt 无变化，跳过提交"
       #     exit 0
       #   else
       #     git add JXZB.txt JXINI
       #     git commit -m "chore: 更新组播源 $(date +%Y-%m-%d)"
       #     git pull --rebase origin main
       #     git push
       #   fi

      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 检测两个目标文件的变动（支持新增、修改、删除，兼容未跟踪的新文件）
          # changed_files=$(git status --porcelain | awk '{print \$2}' | grep -E '^(LCP\.txt|LCPINI)$')               
          changed_files=$(git status --porcelain |
                      awk '{print $2}' |
                      grep -E '^(LCP\.txt|LCPINI)$' || true)
          if [ -z "$changed_files" ]; then
            echo "📂 LCP.txt 和 LCPINI 均无变化，跳过提交"
            exit 0
          else
            echo "✅ 检测到变动文件：$(echo $changed_files | tr ' ' '\n')"
            # 只提交变动的两个文件，不提交无关文件
            git add LCP.txt LCPINI
            git commit -m "chore: 更新组播源 $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
