name: 每日更新IPTV组播源

on:
  # 每天 UTC 0:00 运行（对应北京时间早上 8:00）
  schedule:
    - cron: '0 0 * * *'
  # 允许手动在 Actions 页面触发
  workflow_dispatch:

# 让工作流拥有往仓库推送内容的权限
permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 检出仓库代码
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true   # 后续 push 需要保持凭据

      # 2️⃣ 安装 Python 并获取依赖（requests）
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'   # 使用最新的 3.x 版本

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 3️⃣ 运行处理脚本
      - name: 运行 IPTV 处理脚本
        run: |
          python scripts/process_iptv.py

      # 4️⃣ 提交并推送更新后的 JXZB.txt（若无变化则跳过）

      ###########################################################################
      # ★★★ 新增步骤：按 CCTV‑1综合 测速并删除同源所有频道（稳定版） ★★★
      ###########################################################################
      - name: Speed test & filter unstable sources based on CCTV-1综合
        run: |
          # echo "开始按 CCTV-1综合 测速并过滤源..."
          echo "开始按 CCTV-2财经 测速并过滤源..."

          input="JXZB.txt"
          output="JXZB_filtered.txt"
          rm -f "$output"
          touch "$output"

          declare -A source_keep

          # grep "^CCTV-1综合," "$input" > cctv1_list.txt || true
          grep "^CCTV-2财经," "$input" > cctv1_list.txt || true

          if [ ! -s cctv1_list.txt ]; then
            echo "没有 CCTV-1综合，跳过测速"
            cp "$input" "$output"
            mv "$output" JXZB.txt
            exit 0
          fi

          awk -F'\$' '{print $2}' cctv1_list.txt | sort -u > source_list.txt

          while read -r src; do
            echo "测试源：$src"

            url=$(grep "\$${src}$" cctv1_list.txt | head -n 1 | cut -d',' -f2 | cut -d'$' -f1)

            echo "测速 URL: $url"

            # ① 瞬时速度测试（不会失败）
            speed1=$(curl -o /dev/null --max-time 5 -w "%{speed_download}" "$url" 2>/dev/null || echo "0")
            echo "瞬时速度：$speed1 bytes/s"

            # ② 持续拉流测试（不会 exit 28）
            tmpfile="/tmp/test_${src}.bin"
            rm -f "$tmpfile"

            curl -o "$tmpfile" --max-time 5 "$url" 2>/dev/null || true

            bytes=$(stat -c%s "$tmpfile" 2>/dev/null || echo "0")
            echo "持续拉流 5 秒下载字节数：$bytes"

            threshold=$((1024*1024))  # 1MB

            if [ "${speed1%.*}" -gt "$threshold" ] && [ "$bytes" -gt "$threshold" ]; then
              echo "源 $src 速度合格且持续稳定 → 保留该源所有频道"
              source_keep["$src"]=1
            else
              echo "源 $src 不稳定或速度不足 → 删除该源所有频道"
              source_keep["$src"]=0
            fi

          done < source_list.txt

          while IFS= read -r line; do
            if ! echo "$line" | grep -q '\$'; then
              echo "$line" >> "$output"
              continue
            fi

            src=$(echo "$line" | awk -F'\$' '{print $2}')

            if [ "${source_keep[$src]}" = "1" ]; then
              echo "$line" >> "$output"
            fi

          done < "$input"

          mv "$output" JXZB.txt

      - name: 筛选CCTV-卫生健康频道并输出到新文件
        run: |
          # 规则说明和之前完全一致：
          # 1. ^ 匹配行首，避免误匹配中间包含关键词的其他频道
          # 2. 如果频道名后紧跟逗号（比如你的示例结构），可改成 '/^CCTV-卫生健康,/!d' 匹配更精准
          # 3. 如果行首可能有空格缩进，改成 '/^\s*CCTV-卫生健康/!d' 即可兼容
          # ✅ 核心改动：去掉-i参数，加>重定向到目标文件，不会修改原JXZB.txt
          #  sed -i '/^CCTV-卫生健康/!d' JXZB.txt
          sed '/^CCTV-卫生健康,/!d' JXZB.txt > JXINI

          # 👉 如果你的文件里频道名是「CCTV卫生健康」（无短横线，和你的示例第一行写法一致），把上面命令改成：
          # sed '/^CCTV卫生健康/!d' JXZB.txt > JXINI

      - name: Encrypt JXZB.txt
        run: |
          echo "开始加密 JXZB.txt..."
          node encrypt.js file=JXZB.txt
          node encrypt.js file=JXINI
      
      # - name: 提交更改
      #  run: |
      #    git config user.name "github-actions[bot]"
      #    git config user.email "github-actions[bot]@users.noreply.github.com"
   
          # 检查是否有实际变动，避免空提交
       #   if git diff --quiet JXZB.txt; then
       #     echo "📂 JXZB.txt 无变化，跳过提交"
       #     exit 0
       #   else
       #     git add JXZB.txt JXINI
       #     git commit -m "chore: 更新组播源 $(date +%Y-%m-%d)"
       #     git pull --rebase origin main
       #     git push
       #   fi

      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 检测两个目标文件的变动（支持新增、修改、删除，兼容未跟踪的新文件）
          changed_files=$(git status --porcelain | awk '{print \$2}' | grep -E '^(JXZB\.txt|JXINI)$')

          if [ -z "$changed_files" ]; then
            echo "📂 JXZB.txt 和 JXINI 均无变化，跳过提交"
            exit 0
          else
            echo "✅ 检测到变动文件：$(echo $changed_files | tr ' ' '\n')"
            # 只提交变动的两个文件，不提交无关文件
            git add JXZB.txt JXINI
            git commit -m "chore: 更新组播源 $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi






